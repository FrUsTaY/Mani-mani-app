<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Emerald Gradient -->
    <linearGradient id="emerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg1)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Bold Modern 'M' / Financial Growth Wave -->
  <path d="M 120 360 L 120 190 L 195 285 L 256 210 L 317 285 L 392 190 L 392 360" 
        fill="none" 
        stroke="url(#emerald)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- AI Accent Node (Gemini spark / accent) -->
  <circle cx="392" cy="150" r="16" fill="#FBBF24"/>
</svg>
